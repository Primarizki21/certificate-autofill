services:
  backend_staging:
    image: certificate-autofill-dev-backend:latest
    container_name: cert_backend_staging
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/certautofill
      - ENABLE_KHP_MASTER_STAGING=true
      - ENABLE_TESSERACT_GEMINI=true
      - ENABLE_COMBINED_V4_2=false
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_GEMINI_MODEL=${GOOGLE_GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-30.0}
    ports:
      - "8001:8000"
    volumes:
      - ./khp:/app/khp:ro
    depends_on:
      postgres:
        condition: service_healthy
