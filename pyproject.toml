[project]
name = "certificate-autofill-prototype"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "datasets>=5.0.1",
    "evaluate>=0.4.6",
    "fastapi>=0.140.7",
    "openpyxl>=3.1.5",
    "peft>=0.20.0",
    "pillow>=12.3.0",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "sentencepiece>=0.2.2",
    "seqeval>=1.2.2",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".cache",
    ".venv",
    "docs",
    "data",
    "certs_*",
    "Sertifikat_Ground_Truth",
    "old_docs",
    "build",
    "dist",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "backend/alembic/versions",
    "docs",
    "old_docs",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
    "E731",
    "E741",
    "F841",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
