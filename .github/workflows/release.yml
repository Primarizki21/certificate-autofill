name: Release

# Rilis dibuat dari tag yang sudah ada di main. Alur:
#   1. merge PR ke main
#   2. git tag -a v0.1.0 -m "..." && git push origin v0.1.0
#   3. workflow ini membuat GitHub Release + arsip source + SHA256SUMS
"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validasi tag
        run: |
          set -eu
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag harus berformat vX.Y.Z, bukan $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME menunjuk commit yang belum ada di main"
            exit 1
          fi

      - name: Siapkan arsip source dan checksum
        run: |
          set -eu
          name="certificate-autofill-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          sha256sum "${name}.tar.gz" > SHA256SUMS

      - name: Susun catatan rilis
        run: scripts/generate_release_notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Buat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "certificate-autofill-${GITHUB_REF_NAME}.tar.gz" \
            SHA256SUMS
