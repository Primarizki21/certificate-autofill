name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'backend/app/services/**'
              - 'backend/app/master_data.py'
              - 'backend/app/config.py'
              # Seluruh tests/ ikut memicu gate: file helper (v2_*, router_disambig_v7,
              # nomor_normalizer_v6) diimpor langsung oleh test gate, sehingga daftar
              # file eksplisit gampang tertinggal saat helper berubah.
              - 'tests/**'

  security-audit:
    name: Security & Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit git tracked files for sensitive/forbidden files
        run: |
          echo "Scanning tracked files for forbidden private files..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '\.pdf$|^\.env$|^\.env\.google$|^\.env\.(local|production|development|test)$|\.key$|Ground_Truth.*\.csv|Sertifikat_Ground_Truth/|certs_test/|certs_unified/|^khp/|^docs/stress_test/' | grep -v '^khp/aucc\.sql\.example$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "❌ ERROR: File rahasia, file PDF, atau data AUCC privat terdeteksi masuk ke git tracking:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "✅ Git tracking bersih dari file PDF, rahasia, dan data AUCC privat."

      - name: Scan tracked files for hardcoded secrets & API keys
        run: |
          echo "Scanning tracked files for API keys and secrets..."
          # Pola disamakan dengan scripts/audit_safe_commit.sh agar audit lokal dan CI
          # memakai set yang sama: Google, OpenAI/generic, Stripe, GitHub, AWS, HF,
          # OAuth, Slack, dan private key.
          SECRET_PATTERN='AIza[0-9A-Za-z_-]{35}|(sk|rk)_(live|test)_[0-9A-Za-z_-]{20,}|sk-[0-9A-Za-z]{24,}|ghp_[0-9A-Za-z]{36}|gho_[0-9A-Za-z]{36}|github_pat_[0-9A-Za-z_]{22,}|AKIA[0-9A-Z]{16}|hf_[0-9A-Za-z]{34,}|ya29\.[0-9A-Za-z_-]+|eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}|xox[baprs]-[0-9A-Za-z]{10,}|-----BEGIN (RSA|EC|OPENSSH|DSA|PGP)? PRIVATE KEY-----'
          LEAKED_KEYS=$(git grep -I -E "$SECRET_PATTERN" || true)
          if [ -n "$LEAKED_KEYS" ]; then
            echo "❌ ERROR: Terdeteksi pola API key atau kredensial pada file berikut:"
            echo "$LEAKED_KEYS"
            exit 1
          fi
          echo "✅ Tidak ditemukan kebocoran API key pada kode."

  test:
    name: Lint, Migrations & Pytest Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: certautofill_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      POSTGRES_TEST_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/certautofill_ci"
      GOOGLE_API_KEY: "dummy-test-key-ci"
      # Jalur utama produksi: Indra OCR, Gemini dimatikan agar offline (tanpa kuota).
      ENABLE_INDRA_OCR: "true"
      PRIMARY_OCR_ENGINE: "indra"
      INDRA_OCR_THREADS: "2"
      ENABLE_TESSERACT_GEMINI: "false"
      ENABLE_COMBINED_V4_2: "true"
      PYTHONPATH: ".:backend"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract OCR fallback & libGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind libgl1

      - name: Cache Indra OCR model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indra-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            hf-indra-

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Lint backend (blocking)
        run: uv run ruff check backend/ scripts/stress_test.py scripts/run_stress_matrix.py

      - name: Lint tests (informational, non-blocking)
        # Tes tidak masuk image produksi. Pelanggaran lint di tes dicatat sebagai
        # anotasi, tetapi tidak menggagalkan job; pytest tetap menjadi gate perilaku.
        continue-on-error: true
        run: uv run ruff check tests/test_*.py

      - name: Database migration baseline check (SQLite)
        run: uv run alembic -x url="sqlite:///:memory:" upgrade head

      - name: Database migration check (PostgreSQL 17)
        run: uv run alembic -x url="$POSTGRES_TEST_URL" upgrade head

      - name: Legacy create_all then Alembic (idempotent stamp)
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/certautofill_ci"
        run: |
          uv run python - <<'PY'
          from sqlalchemy import text
          from app.database import engine, init_db

          with engine.begin() as connection:
              connection.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          init_db()
          PY
          uv run python - <<'PY'
          from sqlalchemy import text
          from app.database import engine
          from app.main import _run_auto_migrations

          _run_auto_migrations()
          _run_auto_migrations()
          with engine.connect() as connection:
              version = connection.execute(text("select version_num from alembic_version")).scalar()
          assert version, "alembic_version tidak terisi setelah stamp"
          print(f"alembic_version={version}")
          PY

      - name: Database concurrent startup DDL check (PostgreSQL 17)
        run: uv run python -m tests.test_database_concurrency

      - name: Python syntax & bytecode compilation check
        run: uv run python -m compileall backend/ tests/ scripts/stress_test.py scripts/run_stress_matrix.py -q

      - name: Run Pytest test suite
        run: uv run pytest tests/ -v --durations=10

  ml-quality-gate:
    name: ML Quality & Robustness Gate
    needs: changes
    if: ${{ needs.changes.outputs.pipeline == 'true' }}
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: "sqlite:///:memory:"
      # Jalur utama produksi: Indra OCR. Gemini dimatikan agar gate tetap offline.
      ENABLE_INDRA_OCR: "true"
      PRIMARY_OCR_ENGINE: "indra"
      INDRA_OCR_THREADS: "2"
      ENABLE_TESSERACT_GEMINI: "false"
      ENABLE_COMBINED_V4_2: "true"
      PYTHONPATH: ".:backend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tesseract OCR fallback & libGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ind libgl1

      - name: Cache Indra OCR model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indra-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            hf-indra-

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Synthetic ML Evaluation & Robustness Invariants
        run: |
          uv run pytest \
            tests/test_benchmark_v2_production_equivalent.py \
            tests/test_v2_staging_steps.py \
            tests/test_combined_v4_2.py \
            tests/test_structural_act_robustness.py \
            tests/test_nomor_v6.py \
            tests/test_router_disambig_hardening.py \
            tests/test_validate_v2_production_equivalent.py \
            -v

      - name: Run Primary OCR & Gemini Path Invariants
        # Indra adalah engine utama; Gemini diuji pada level klien/ekstraktor dengan
        # HTTP dimock sehingga tidak memerlukan API key atau jaringan.
        run: |
          uv run pytest \
            tests/test_ocr_engine_indra.py \
            tests/test_production_indra_pipeline.py \
            tests/test_gemini_pipeline.py \
            -v

  docker-build:
    name: Docker Compose Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build

      - name: Container smoke test (production posture)
        run: |
          docker run -d --name smoke-backend -p 8001:8000 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e APP_ENV=production \
            -e ADMIN_PASSWORD=ci-strong-password \
            -e ENABLE_TESSERACT_GEMINI=false \
            -e GOOGLE_API_KEY= \
            certificate-autofill-dev-backend:latest
          trap 'docker rm -f smoke-backend' EXIT
          code=""
          # curl bisa mengembalikan 56 (connection reset) saat uvicorn belum siap.
          # Tanpa `|| true`, `set -e` di langkah Actions menghentikan loop lebih awal.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs smoke-backend | tail -40
          docker inspect -f 'state={{.State.Status}}' smoke-backend
          test "$code" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/docs)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/api/admin/khp/rules)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u admin:admin123 http://localhost:8001/api/admin/khp/rules)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -u admin: http://localhost:8001/api/admin/khp/rules)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/api/documents/not-a-uuid/result)" = "404"

      - name: Scan image for vulnerabilities (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: certificate-autofill-dev-backend:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
