global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "certificate-autofill-backend"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "certificate-autofill-worker"
    static_configs:
      - targets: ["worker:9102"]
